<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore Free Courses | FreeCourseHub</title>

  <!-- Open Graph Meta Tags (Social Media Previews) -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="FreeCourseHub"/>
  <meta property="og:title" content="Explore Free Courses & Categories | FreeCourseHub"/>
  <meta property="og:description" content="Access verified free online courses and learning paths in Web Dev, AI, Data Analytics, and Excel."/>
  <meta property="og:image" content="https://freecoursehub.xyz/preview.png"/>
  
  <!-- Image dimensions for best preview display -->
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Explore Free Courses & Categories | FreeCourseHub"/>
  <meta name="twitter:description" content="Access verified free online courses and learning paths in Web Dev, AI, Data Analytics, and Excel."/>
  <meta name="twitter:image" content="https://freecoursehub.xyz/preview.png"/>

  <!-- Search Engine exclusion -->
  <meta name="robots" content="noindex, follow"/>
  <meta name="author" content="Munendra Singh"/>
</head>

<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 85vh; background-color: #f8fafc; color: #334155; margin: 0;">
  
  <!-- Loading UI while redirecting -->
  <div style="text-align: center; padding: 30px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);">
    <!-- Blue Spinner -->
    <div style="width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
    
    <h3 style="font-weight: 600; font-size: 18px; margin: 0 0 8px; color: #0f172a;">Opening Link...</h3>
    <p style="font-size: 14px; color: #64748b; margin: 0;">Redirecting you to FreeCourseHub.</p>
  </div>

  <!-- CSS Animation for Spinner -->
  <style>
    @keyframes spin { 
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); } 
    }
  </style>

  <!-- Dual Redirection JavaScript Engine (Handles both Courses & Categories) -->
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const courseId = params.get('id') || params.get('course');
      const categoryKey = params.get('cat') || params.get('category');

      let destination = "https://freecoursehub.xyz/sections/Courses.html";

      // 1. Agar Course ID aayi hai:
      if (courseId) {
        destination = "https://freecoursehub.xyz/sections/Courses.html?course=" + encodeURIComponent(courseId);
      } 
      // 2. Agar Category Key aayi hai:
      else if (categoryKey) {
        destination = "https://freecoursehub.xyz/sections/Categories.html?category=" + encodeURIComponent(categoryKey);
      }

      // Smooth fast redirect
      setTimeout(() => {
        window.location.replace(destination);
      }, 250);
    })();
  </script>
</body>
</html>
